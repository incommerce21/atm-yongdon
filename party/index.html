<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>ATM용돈박스 잔치형</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Gothic+Coding:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1A1030;
  --yellow:#FFD21F;
  --red:#FF3B4E;
  --red-d:#C71F33;
  --blue:#2F6BFF;
  --green:#2ECC71;
  --green-d:#1E9E55;
  --pink:#FF8FB8;
  --white:#FFFFFF;
  --display:'Black Han Sans','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;
  --mono:'Nanum Gothic Coding','Noto Sans KR',monospace;
  --outline:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
html,body{height:100%;overflow:hidden;background:var(--yellow);color:var(--ink);font-family:var(--body);
  word-break:keep-all;overflow-wrap:break-word;touch-action:manipulation}

#bg{position:fixed;inset:0;
  background:
    radial-gradient(circle,rgba(255,255,255,.55) 0 3px,transparent 3.5px) 0 0/26px 26px,
    linear-gradient(180deg,#FFE04D,#FFC800)}

@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ring{0%{box-shadow:0 7px 0 var(--ink),0 0 0 0 rgba(255,59,78,.6)}70%{box-shadow:0 7px 0 var(--ink),0 0 0 18px rgba(255,59,78,0)}100%{box-shadow:0 7px 0 var(--ink),0 0 0 0 rgba(255,59,78,0)}}
@keyframes dotPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes flyIn{0%{transform:translateY(0) scale(1) rotate(0);opacity:1}70%{opacity:1}100%{transform:translateY(150px) scale(.5) rotate(-3deg);opacity:0}}
@keyframes stripes{to{background-position:32px 0}}
@keyframes belt{from{transform:translateX(-90px)}to{transform:translateX(calc(100vw))}}
@keyframes bannerIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes ticketIn{0%{transform:translateY(60px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes raysSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes bump{0%{transform:translateY(0)}40%{transform:translateY(-18px) scale(1.15)}100%{transform:translateY(0)}}
@keyframes bigShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,3px)}30%{transform:translate(6px,-4px)}45%{transform:translate(-5px,4px)}60%{transform:translate(4px,-3px)}75%{transform:translate(-3px,2px)}90%{transform:translate(2px,-1px)}}
@keyframes flashPulse{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
@keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

#stageShake{position:fixed;inset:0;z-index:2}

/* ---------- step bar ---------- */
.stepbar{position:absolute;left:12px;right:12px;top:12px;height:46px;display:none;gap:6px;z-index:5}
body:not([data-step=screenSetup]) .stepbar{display:flex}
.st{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  background:#fff;border:3px solid var(--ink);border-radius:14px;font-weight:900;font-size:13.5px;color:#8B84A3;
  box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.st i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:#E6E2F2;color:#8B84A3;font-size:12px;font-weight:900}
.stepbar[data-i="0"] .st:nth-child(1),.stepbar[data-i="1"] .st:nth-child(2),
.stepbar[data-i="2"] .st:nth-child(3),.stepbar[data-i="3"] .st:nth-child(4){background:var(--red);color:#fff;transform:translateY(-1px)}
.stepbar[data-i="0"] .st:nth-child(1) i,.stepbar[data-i="1"] .st:nth-child(2) i,
.stepbar[data-i="2"] .st:nth-child(3) i,.stepbar[data-i="3"] .st:nth-child(4) i{background:var(--yellow);color:var(--ink)}
.stepbar[data-i="1"] .st:nth-child(1),.stepbar[data-i="2"] .st:nth-child(-n+2),.stepbar[data-i="3"] .st:nth-child(-n+3){background:var(--green);color:#fff}
.stepbar[data-i="1"] .st:nth-child(1) i,.stepbar[data-i="2"] .st:nth-child(-n+2) i,.stepbar[data-i="3"] .st:nth-child(-n+3) i{background:#fff;color:var(--green-d)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
.page{position:absolute;left:0;right:0;top:70px;bottom:0;padding:10px 16px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;animation:pop .35s ease}

/* ---------- setup ---------- */
#screenSetup{overflow-y:auto;padding:22px 16px 44px}
.setup-b{max-width:420px;margin:0 auto}
.hero{display:flex;align-items:center;justify-content:center;gap:10px}
.bag{width:84px;height:84px;flex:none;animation:bob 2.2s ease-in-out infinite}
.bag.big{width:120px;height:120px}
.title-b{display:flex;flex-direction:column;line-height:.95}
.t1{font-family:var(--display);font-size:30px;color:#fff;background:var(--red);border:4px solid var(--ink);border-radius:12px;padding:2px 12px 4px;align-self:flex-start;box-shadow:0 4px 0 var(--ink);transform:rotate(-3deg)}
.t2{font-family:var(--display);font-size:54px;color:#fff;text-shadow:var(--outline),0 7px 0 var(--ink);margin-top:6px}
.lead{text-align:center;font-weight:900;font-size:18px;line-height:1.5;margin:12px 0 18px}
.paper{background:#fff;border:4px solid var(--ink);border-radius:26px;padding:20px 18px 20px;box-shadow:8px 8px 0 var(--ink)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:900;font-size:16px;margin-bottom:6px}
.field input,.field textarea{width:100%;height:58px;padding:0 16px;font-family:var(--body);font-size:20px;font-weight:700;color:var(--ink);
  background:#FFF8D6;border:3px solid var(--ink);border-radius:14px;outline:none;transition:box-shadow .15s}
.field textarea{height:96px;padding:12px 16px;resize:none;line-height:1.45}
.field input::placeholder,.field textarea::placeholder{color:#A59C84;font-weight:500}
.field input:focus,.field textarea:focus{box-shadow:0 0 0 5px rgba(47,107,255,.55)}
.voice-opt{display:flex;align-items:center;gap:14px;padding:14px;margin:4px 0 18px;background:#E8F0FF;border:3px dashed var(--ink);border-radius:16px;cursor:pointer}
.voice-opt input{width:28px;height:28px;accent-color:var(--red);flex:none}
.voice-opt span{font-weight:900;font-size:17px;line-height:1.3}
.voice-opt small{display:block;font-weight:500;font-size:13.5px;color:#4A4470;margin-top:2px}
.btn-go,.screen-btn,.btn-reset{
  width:100%;max-width:420px;height:68px;border:4px solid var(--ink);border-radius:20px;cursor:pointer;
  background:var(--red);color:#fff;font-family:var(--display);font-size:32px;letter-spacing:1px;
  text-shadow:2px 2px 0 var(--red-d);box-shadow:0 7px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn-go:active,.screen-btn:active,.btn-reset:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.screen-btn{animation:ring 1.8s infinite;flex:none}

/* ---------- ATM ---------- */
.bubble{position:relative;width:100%;max-width:400px;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:20px 16px;box-shadow:8px 8px 0 var(--ink);flex:0 1 auto;min-height:0}
.bubble::after{content:'';position:absolute;left:50%;bottom:-18px;width:26px;height:26px;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.atm-msg{max-height:210px;overflow:hidden;font-family:var(--display);font-size:30px;line-height:1.55;font-weight:400}
.hl{background:linear-gradient(transparent 52%,var(--yellow) 52%);padding:0 4px;border-radius:4px}
#screenATM .bag.big{margin:12px 0 0}

/* ---------- PIN ---------- */
.pin-page{gap:10px;justify-content:flex-start;padding-top:14px}
.pin-title{font-family:var(--display);font-size:28px;line-height:1.3;font-weight:400}
.pin-dots{display:flex;gap:14px}
.pin-dot{width:34px;height:34px;border-radius:50%;border:4px solid var(--ink);background:#fff;display:inline-block}
.pin-dot.filled{background:var(--red);animation:dotPop .22s ease}
.pin-hint{font-weight:900;font-size:16px;color:var(--ink);min-height:24px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 16px}
.pin-hint.ready{background:var(--green);color:#fff}
.pin-hint.nudge{animation:nudge .4s ease}
.keys{width:100%;max-width:400px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.key{height:clamp(46px,8.2vh,66px);border:4px solid var(--ink);border-radius:18px;background:#fff;color:var(--ink);cursor:pointer;
  font-family:var(--display);font-size:30px;box-shadow:0 6px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.key:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.key.fn{font-size:22px}
.key.yellow{background:var(--yellow)}
.key.gray{background:#D9D4E8}
.key.red{background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--red-d)}
.key.green{background:var(--green);color:#fff;text-shadow:2px 2px 0 var(--green-d);font-size:28px}
.key.wide{grid-column:span 2}
.key.ghost{visibility:hidden}

/* ---------- card ---------- */
.ci-title{font-family:var(--display);font-size:34px;font-weight:400;text-shadow:3px 3px 0 #fff}
.card-zone{position:relative;width:100%;max-width:340px;height:300px}
.pcard{position:absolute;left:0;right:0;top:0;height:190px;padding:18px 20px;border:4px solid var(--ink);border-radius:20px;
  background:linear-gradient(135deg,#6FD3FF,#2F6BFF);box-shadow:6px 6px 0 var(--ink);
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;cursor:pointer;z-index:3;animation:bob 2s ease-in-out infinite}
.pcard.sliding{animation:flyIn .75s cubic-bezier(.5,0,.8,.55) forwards}
.chip{width:46px;height:34px;border-radius:7px;border:3px solid var(--ink);background:linear-gradient(135deg,#FFE88A,var(--yellow))}
.cnum{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:2px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.clabel{font-family:var(--display);font-size:16px;letter-spacing:3px;color:var(--ink)}
.slot-b{position:absolute;left:-6px;right:-6px;top:200px;height:70px;background:var(--ink);border-radius:20px;z-index:2;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.slot-b::before{content:'';position:absolute;left:18px;right:18px;top:16px;height:14px;border-radius:7px;background:#000;box-shadow:0 0 12px var(--green)}
.slot-b span{font-weight:900;font-size:13px;color:#fff;letter-spacing:3px;position:relative}
.ci-hint{font-weight:900;font-size:18px;color:var(--red-d);animation:hint 1.2s ease-in-out infinite}

/* ---------- check ---------- */
.cc-title{font-family:var(--display);font-size:38px;font-weight:400;text-shadow:3px 3px 0 #fff}
.belt{position:relative;width:calc(100% + 32px);height:76px;margin:0 -16px;overflow:hidden}
.belt-line{position:absolute;left:0;right:0;bottom:6px;height:14px;background:var(--ink);border-radius:7px;
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 16px,#4A3F70 16px 32px);animation:stripes .6s linear infinite}
.mv{position:absolute;bottom:18px;left:0;font-size:44px;animation:belt 2.6s linear infinite}
.m2{animation-delay:-.65s}.m3{animation-delay:-1.3s}.m4{animation-delay:-1.95s}
.progress{width:100%;max-width:380px;height:34px;border:4px solid var(--ink);border-radius:17px;background:#fff;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.fill{height:100%;width:0;border-radius:12px;transition:width .6s ease;
  background:repeating-linear-gradient(45deg,var(--red) 0 14px,#FF6B7A 14px 28px);background-size:40px 100%;animation:stripes .5s linear infinite}
.cc-status{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.spinner{width:24px;height:24px;border:5px solid #fff;border-top-color:var(--red);border-radius:50%;animation:spin .9s linear infinite}
.cc-note{font-weight:700;font-size:16px;color:#5B4B00}

/* ---------- result ---------- */
#screenResult{background:radial-gradient(circle at 50% 30%,#FFF27A,#FFC800 70%)}
.rays{position:absolute;left:50%;top:30%;width:230vmax;height:230vmax;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(rgba(255,255,255,.55) 0 7.5deg,transparent 7.5deg 15deg);animation:raysSpin 24s linear infinite;pointer-events:none}
.res-page{top:0;padding-top:20px;gap:12px;justify-content:center;animation:none}
.banner{position:relative;background:var(--red);border:5px solid var(--ink);border-radius:20px;padding:6px 26px 10px;
  box-shadow:0 8px 0 var(--ink);animation:bannerIn .7s cubic-bezier(.2,1.4,.4,1) .1s both}
.banner span{font-family:var(--display);font-size:50px;line-height:1.1;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.ticket{position:relative;width:100%;max-width:380px;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px 16px 12px;
  box-shadow:7px 7px 0 var(--ink);animation:ticketIn .6s cubic-bezier(.2,1.2,.4,1) .6s both}
.t-to{font-weight:900;font-size:16px;line-height:1.4}
.t-to b{background:linear-gradient(transparent 55%,var(--yellow) 55%);padding:0 3px;font-size:19px}
.t-line{border-top:3px dashed var(--ink);margin:9px 0}
.r-msg{font-family:var(--display);font-size:30px;line-height:1.45;font-weight:400;max-height:150px;overflow:hidden;white-space:pre-line}
.t-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:17px}
.t-row b{font-family:var(--display);font-weight:400;font-size:21px;color:var(--red-d)}
.t-row.small{margin-top:6px;font-family:var(--mono);font-size:12.5px;color:#6B6490;font-weight:700}
.pile{display:flex;gap:10px;justify-content:center;animation:ticketIn .6s ease 1s both}
.bill-b{font-size:40px;background:none;border:none;cursor:pointer;filter:drop-shadow(0 4px 0 rgba(26,16,48,.35));animation:bob 2s ease-in-out infinite}
.bill-b.b2{animation-delay:-.7s;font-size:48px}.bill-b.b3{animation-delay:-1.4s}
.bill-b.bump{animation:bump .4s ease}
.tap-hint{font-weight:900;font-size:15px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;animation:hint 1.4s ease-in-out infinite}
.btn-reset{height:56px;font-size:24px;max-width:300px;background:var(--blue);text-shadow:2px 2px 0 #1B47B8;animation:ticketIn .6s ease 1.2s both}

.flash-layer{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.7) 50%,transparent 80%)}
.flash-layer.flash{animation:flashPulse .6s ease-out}
.shake{animation:bigShake .5s cubic-bezier(.36,.07,.19,.97)}
#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* ---------- small phones ---------- */
@media (max-height:700px){
  .page{top:64px;gap:8px}
  .bag.big{width:84px;height:84px}
  .atm-msg{max-height:150px}
  .pin-title{font-size:24px}
  .ci-title{font-size:28px}
  .card-zone{height:250px}
  .pcard{height:160px}
  .slot-b{top:170px;height:62px}
  .banner span{font-size:40px}
  .r-msg{max-height:110px}
  .pile{display:none}
}

</style>
<div id="bg" aria-hidden="true"></div>

<div id="stageShake">
  <div class="stepbar" id="stepbar" data-i="0" aria-hidden="true">
    <span class="st"><i>1</i>안내</span>
    <span class="st"><i>2</i>비밀번호</span>
    <span class="st"><i>3</i>카드</span>
    <span class="st"><i>4</i>완료</span>
  </div>

  <div class="screen active" id="screenSetup">
    <div class="setup-b">
      <div class="hero">
        <svg class="bag" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M44 22 Q60 6 76 22 L70 34 H50 Z" fill="#FF8A3D" stroke="#1A1030" stroke-width="5" stroke-linejoin="round"/>
          <path d="M46 34 H74 Q108 58 104 90 Q100 112 60 112 Q20 112 16 90 Q12 58 46 34 Z" fill="#FFB33D" stroke="#1A1030" stroke-width="5" stroke-linejoin="round"/>
          <path d="M48 36 H72" stroke="#1A1030" stroke-width="5" stroke-linecap="round"/>
          <text x="60" y="92" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="44" fill="#1A1030">₩</text>
        </svg>
        <div class="title-b"><span class="t1">ATM</span><span class="t2">용돈박스</span></div>
      </div>
      <p class="lead">받는 분 이름과 메시지를 적으면<br>두근두근 ATM이 열려요!</p>
      <form class="paper" onsubmit="event.preventDefault();goATM();">
        <div class="field">
          <label for="inputTo">받는 사람</label>
          <input type="text" id="inputTo" placeholder="예: 엄마, 이순자" autocomplete="off">
        </div>
        <div class="field">
          <label for="inputEvent">이벤트명</label>
          <input type="text" id="inputEvent" placeholder="예: 생일, 환갑" autocomplete="off">
        </div>
        <div class="field">
          <label for="inputFrom">준비한 사람</label>
          <input type="text" id="inputFrom" placeholder="예: 아들, 딸, 이하늘" autocomplete="off">
        </div>
        <div class="field">
          <label for="inputMsg">마지막 메시지</label>
          <textarea id="inputMsg" placeholder="예: 용돈에 만족하셨으면 안아주세요 :)&#10;건강하고, 행복하세요~"></textarea>
        </div>
        <label class="voice-opt">
          <input type="checkbox" id="voiceOn" checked>
          <span>ATM 안내 음성 켜기<small>진짜 ATM처럼 말로 알려줘요</small></span>
        </label>
        <button class="btn-go" type="submit">ATM 켜기!</button>
      </form>
    </div>
  </div>

  <div class="screen" id="screenATM">
    <div class="page">
      <div class="bubble"><p class="atm-msg" id="atmMsg"></p></div>
      <svg class="bag big" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M44 22 Q60 6 76 22 L70 34 H50 Z" fill="#FF8A3D" stroke="#1A1030" stroke-width="5" stroke-linejoin="round"/>
        <path d="M46 34 H74 Q108 58 104 90 Q100 112 60 112 Q20 112 16 90 Q12 58 46 34 Z" fill="#FFB33D" stroke="#1A1030" stroke-width="5" stroke-linejoin="round"/>
        <path d="M48 36 H72" stroke="#1A1030" stroke-width="5" stroke-linecap="round"/>
        <text x="60" y="92" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="44" fill="#1A1030">₩</text>
      </svg>
      <button class="screen-btn" type="button" onclick="goPIN()">출금하기</button>
    </div>
  </div>

  <div class="screen" id="screenPIN">
    <div class="page pin-page">
      <p class="pin-title">비밀번호 4자리를 눌러주세요</p>
      <div class="pin-dots"><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i></div>
      <p class="pin-hint" id="pinHint"></p>
      <div class="keys">
        <button class="key" type="button" onclick="pressKey(1)">1</button>
        <button class="key" type="button" onclick="pressKey(2)">2</button>
        <button class="key" type="button" onclick="pressKey(3)">3</button>
        <button class="key" type="button" onclick="pressKey(4)">4</button>
        <button class="key" type="button" onclick="pressKey(5)">5</button>
        <button class="key" type="button" onclick="pressKey(6)">6</button>
        <button class="key" type="button" onclick="pressKey(7)">7</button>
        <button class="key" type="button" onclick="pressKey(8)">8</button>
        <button class="key" type="button" onclick="pressKey(9)">9</button>
        <button class="key fn yellow" type="button" onclick="pressClear()">정정</button>

<script>
(function(){
'use strict';

var UI = window.UI || {};
var $ = function(id){ return document.getElementById(id); };
var pin = [], data = {}, cur = 'screenSetup';
var voiceOn = true;
var timers = [];
var reduced = false;
try{ reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', function(e){ if(e.touches.length > 1) e.preventDefault(); }, {passive:false});

/* ---------- small helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function setText(id, t){ var el = $(id); if(el) el.textContent = t; }
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function later(fn, ms){ var t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

/* 받침 유무에 따라 이/가, 은/는 을 알맞게 */
function josa(word, withBatchim, without){
  var c = word.charCodeAt(word.length - 1);
  if(c >= 0xAC00 && c <= 0xD7A3){ return ((c - 0xAC00) % 28 !== 0) ? withBatchim : without; }
  return withBatchim + '(' + without + ')';
}

function fitBox(el, max, min){
  if(!el) return;
  var s = max;
  el.style.fontSize = s + 'px';
  while(el.scrollHeight > el.clientHeight + 1 && s > min){ s -= 1; el.style.fontSize = s + 'px'; }
}

function tryFullscreen(){
  try{
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ var p = req.call(el); if(p && p.catch) p.catch(function(){}); }
  }catch(e){}
}

/* ---------- ATM 안내 음성 (기기 내장 한국어 음성) ---------- */
function speak(text){
  if(!voiceOn) return;
  try{
    var s = window.speechSynthesis; if(!s) return;
    s.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.95; u.pitch = 1.05; u.volume = 1;
    s.speak(u);
  }catch(e){}
}
function stopSpeak(){ try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){} }

/* ---------- 효과음 (키 삑 소리 등, 합성) ---------- */
var actx = null;
function getCtx(){
  if(!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function tone(freq, dur, type, peak, delay){
  var ctx = getCtx(); if(!ctx) return;
  var t = ctx.currentTime + (delay || 0);
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function playBeep(){ tone(1400, 0.07, 'square', 0.1); }
function playPop(){ tone(660, 0.12, 'triangle', 0.22); tone(990, 0.2, 'sine', 0.18, 0.05); }
function playCoin(){ tone(1760, 0.1, 'square', 0.09); tone(2349, 0.28, 'sine', 0.16, 0.08); }

/* ---------- 화면 전환 ---------- */
function switchScreen(id){
  cur = id;
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $(id).classList.add('active');
  document.body.setAttribute('data-step', id);
  if(UI.onScreen) UI.onScreen(id);
}

/* ---------- 흐름 ---------- */
function goATM(){
  var v = $('voiceOn'); voiceOn = v ? v.checked : true;
  getCtx();
  tryFullscreen();
  data.to    = ($('inputTo').value || '').trim()    || '소중한 분';
  data.event = ($('inputEvent').value || '').trim() || '특별한 날';
  data.from  = ($('inputFrom').value || '').trim()  || '사랑하는 사람';
  data.msg   = ($('inputMsg').value || '').trim()   || '사랑합니다 💕';
  $('atmMsg').innerHTML =
    '<span class="hl">' + esc(data.to) + '</span> 님<br>' +
    '<span class="hl">' + esc(data.from) + '</span>' + josa(data.from, '이', '가') +
    ' <span class="hl">' + esc(data.event) + '</span> 기념으로<br>용돈을 준비하셨습니다!';
  switchScreen('screenATM');
  fitBox($('atmMsg'), UI.atmFont || 28, 16);
  speak(data.to + '님, ' + data.from + josa(data.from, '이', '가') + ' ' + data.event +
        ' 기념으로 용돈을 준비하셨습니다. 출금하기 버튼을 눌러주세요.');
}

function goPIN(){
  pin = []; updateDots(); setPinHint();
  switchScreen('screenPIN');
  speak('비밀번호 네 자리를 눌러주세요. 아무 숫자나 괜찮아요.');
}
function setPinHint(){
  var h = $('pinHint'); if(!h) return;
  var n = pin.length;
  h.textContent = n === 0 ? '숫자 4개를 눌러주세요 (아무 숫자나 괜찮아요)'
                : n < 4  ? '숫자 ' + (4 - n) + '개 더 눌러주세요'
                         : '좋아요! 이제 [확인]을 눌러주세요';
  h.classList.toggle('ready', n === 4);
}
function updateDots(){
  document.querySelectorAll('.pin-dot').forEach(function(d, i){ d.classList.toggle('filled', i < pin.length); });
}
function pressKey(n){
  if(cur !== 'screenPIN' || pin.length >= 4) return;
  pin.push(n); updateDots(); setPinHint(); vibrate(20); playBeep();
}
function pressBack(){
  if(cur !== 'screenPIN' || !pin.length) return;
  pin.pop(); updateDots(); setPinHint(); vibrate(15); playBeep();
}
function pressClear(){
  if(cur !== 'screenPIN') return;
  pin = []; updateDots(); setPinHint(); vibrate(15); playBeep();
}
function pressCancel(){
  if(cur !== 'screenPIN') return;
  playBeep(); stopSpeak(); switchScreen('screenATM');
}
function submitPIN(){
  if(cur !== 'screenPIN') return;
  if(pin.length < 4){
    var h = $('pinHint');
    if(h){ h.classList.remove('nudge'); void h.offsetWidth; h.classList.add('nudge'); }
    vibrate([30, 40, 30]); return;
  }
  vibrate([20, 30, 20]); playBeep();
  goCardInsert();
}

function goCardInsert(){
  switchScreen('screenCardInsert');
  var c = $('insertCard');
  c.classList.remove('sliding'); c.style.pointerEvents = 'auto';
  speak('카드를 넣어주세요.');
}
function insertCard(){
  if(cur !== 'screenCardInsert') return;
  var c = $('insertCard');
  if(c.classList.contains('sliding')) return;
  c.style.pointerEvents = 'none';
  vibrate([30, 50, 30]); playPop();
  c.classList.add('sliding');
  later(goCardCheck, 750);
}

function setProgress(i, total){
  var f = $('progressFill'); if(f) f.style.width = Math.round((i + 1) / total * 100) + '%';
}
function goCardCheck(){
  switchScreen('screenCardCheck');
  var msgs = ['보안 연결 중...', '카드 인증 확인 중...', '출금 처리 중...', '완료!'];
  var i = 0;
  setText('securityText', msgs[0]); setProgress(0, msgs.length);
  speak('거래 중입니다. 잠시만 기다려주세요.');
  var iv = setInterval(function(){
    i++;
    if(i < msgs.length){ setText('securityText', msgs[i]); setProgress(i, msgs.length); vibrate(15); playBeep(); }
    if(i >= msgs.length){ clearInterval(iv); stopSpeak(); later(goResult, 550); }
  }, 820);
  timers.push(iv);
}

function pad(n){ return (n < 10 ? '0' : '') + n; }
function goResult(){
  stopSpeak();
  var d = new Date();
  setText('resultMsg', data.msg);
  setText('resultFrom', data.from);
  setText('resultTo', data.to);
  setText('resultEvent', data.event);
  setText('resultDate', d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
  setText('resultNo', 'NO.' + (100000 + Math.floor(Math.random() * 899999)));
  switchScreen('screenResult');
  fitBox($('resultMsg'), UI.resultFont || 26, 14);
  celebrate();
}

function resetApp(){
  clearTimers();
  stopConfetti(); stopSpeak();
  var a = $('celebrationAudio');
  if(a){ try{ a.pause(); a.currentTime = 0; }catch(e){} }
  pin = []; data = {};
  ['inputTo', 'inputEvent', 'inputFrom', 'inputMsg'].forEach(function(id){ $(id).value = ''; });
  switchScreen('screenSetup');
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}

/* ---------- 피날레: 소리 + 번쩍 + 흔들 + 폭죽 ---------- */
function playCelebrationAudio(){
  var a = $('celebrationAudio'); if(!a) return;
  try{ a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
function celebrate(){
  playCelebrationAudio();
  var f = $('resultFlash');
  if(f){ f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash'); }
  var s = $(UI.shakeId || 'screenResult');
  if(s){ s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
  startConfetti();
}

/* ---------- 폭죽 (이모지는 스프라이트로 미리 그려서 가볍게) ---------- */
var spriteCache = {};
function getSprite(emoji, size){
  var b = Math.round(size / 4) * 4, key = emoji + '_' + b;
  if(spriteCache[key]) return spriteCache[key];
  var c = document.createElement('canvas'); c.width = c.height = b + 8;
  var x = c.getContext('2d');
  x.font = b + 'px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(emoji, c.width / 2, c.height / 2);
  spriteCache[key] = c; return c;
}

var confettiRAF = null, confettiActive = false, burstTimer = null;
var pieces = [], CW = 0, CH = 0, cctx = null, burstsDone = 0, resizeBound = false;
var MAX_PIECES = reduced ? 60 : 200;

function sizeCanvas(){
  var c = $('confettiCanvas'); if(!c) return;
  CW = c.width = window.innerWidth; CH = c.height = window.innerHeight;
}
function spawnBurst(cx, cy, per){
  var colors = UI.confettiColors || ['#ffd21f', '#ff4f9a', '#2f6bff', '#2ecc71', '#ffffff', '#ff7a45'];
  var emojis = UI.confettiEmojis || ['💵', '🪙', '✨'];
  for(var i = 0; i < per; i++){
    var ang = Math.random() * Math.PI * 2, sp = 4.5 + Math.random() * 9;
    var em = Math.random() < 0.24;
    pieces.push({
      x: cx, y: cy,
      vx: Math.cos(ang) * sp * (0.5 + Math.random()),
      vy: Math.sin(ang) * sp * (0.5 + Math.random()) - 5,
      w: em ? (20 + Math.random() * 12) : (7 + Math.random() * 10),
      h: em ? 0 : (4 + Math.random() * 7),
      color: colors[Math.floor(Math.random() * colors.length)],
      emoji: em ? emojis[Math.floor(Math.random() * emojis.length)] : null,
      rz: Math.random() * 360, sz: (Math.random() - .5) * 12,
      rx: Math.random() * 360, sx: (Math.random() - .5) * 14,
      g: 0.12 + Math.random() * 0.09,
      life: 1, decay: 0.003 + Math.random() * 0.0045,
      shape: Math.random()
    });
  }
  if(pieces.length > MAX_PIECES) pieces.splice(0, pieces.length - MAX_PIECES);
}
function autoBurst(){
  if(!confettiActive) return;
  spawnBurst(Math.random() * CW, CH * 0.12 + Math.random() * CH * 0.28, reduced ? 10 : 22);
  burstsDone++;
  if(burstsDone < (reduced ? 2 : 8)){
    burstTimer = setTimeout(autoBurst, reduced ? 400 : 240 + Math.random() * 340);
  } else {
    burstTimer = setTimeout(function(){ burstsDone = 0; autoBurst(); }, reduced ? 2600 : 1500 + Math.random() * 950);
  }
}
function extraBurst(x, y){
  if(!confettiActive) return;
  spawnBurst(x, y, reduced ? 8 : 20);
}
function frame(){
  if(!confettiActive){ cctx.clearRect(0, 0, CW, CH); return; }
  cctx.clearRect(0, 0, CW, CH);
  for(var i = pieces.length - 1; i >= 0; i--){ if(pieces[i].life <= 0) pieces.splice(i, 1); }
  for(var k = 0; k < pieces.length; k++){
    var p = pieces[k];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.99;
    p.rz += p.sz; p.rx += p.sx; p.life -= p.decay;
    if(p.life <= 0) continue;
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.globalAlpha = Math.max(0, p.life);
    cctx.rotate(p.rz * Math.PI / 180);
    if(p.emoji){
      var sp = getSprite(p.emoji, p.w);
      cctx.drawImage(sp, -sp.width / 2, -sp.height / 2);
    } else {
      var w = Math.abs(Math.cos(p.rx * Math.PI / 180)) * p.w;
      cctx.fillStyle = p.color;
      if(p.shape < 0.4){ cctx.beginPath(); cctx.arc(0, 0, w / 2, 0, Math.PI * 2); cctx.fill(); }
      else if(p.shape < 0.75){ cctx.fillRect(-w / 2, -p.h / 2, Math.max(w, 2), p.h); }
      else {
        cctx.beginPath(); cctx.moveTo(-w / 2, 0);
        cctx.quadraticCurveTo(0, -p.h * 1.6, w / 2, 0);
        cctx.quadraticCurveTo(0, p.h * 1.6, -w / 2, 0);
        cctx.fill();
      }
    }
    cctx.restore();
  }
  confettiRAF = requestAnimationFrame(frame);
}
function startConfetti(){
  var c = $('confettiCanvas'); if(!c) return;
  cctx = c.getContext('2d');
  sizeCanvas();
  if(!resizeBound){ window.addEventListener('resize', sizeCanvas); resizeBound = true; }
  pieces = []; burstsDone = 0; confettiActive = true;
  autoBurst();
  confettiRAF = requestAnimationFrame(frame);
}
function stopConfetti(){
  confettiActive = false;
  if(burstTimer){ clearTimeout(burstTimer); burstTimer = null; }
  if(confettiRAF){ cancelAnimationFrame(confettiRAF); confettiRAF = null; }
  if(cctx) cctx.clearRect(0, 0, CW, CH);
  pieces = [];
}

/* 결과 화면을 두드리면 폭죽이 더 터져요 */
document.addEventListener('pointerdown', function(e){
  if(cur !== 'screenResult') return;
  if(e.target.closest && e.target.closest('button')) return;
  extraBurst(e.clientX, e.clientY); playPop(); vibrate(15);
});

window.goATM = goATM; window.goPIN = goPIN;
window.pressKey = pressKey; window.pressBack = pressBack; window.pressClear = pressClear;
window.pressCancel = pressCancel; window.submitPIN = submitPIN;
window.insertCard = insertCard; window.resetApp = resetApp;
window.__core = { extraBurst: extraBurst, playCoin: playCoin, playPop: playPop, vibrate: vibrate };

document.body.setAttribute('data-step', 'screenSetup');
if(UI.onScreen) UI.onScreen('screenSetup');
})();

</script>
